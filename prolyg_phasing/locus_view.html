<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyG Locus Reads</title>
<style>
/* Layout: a bench instrument. Locus list on the left, one locus read-out on the right; sequences in mono, bases in fixed colors. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --fg:#1b2330; --muted:#5d6878; --line:#dde2e9; --accent:#0f6e8c;
  --chip:#eef2f6; --warn:#a85c00; --warnbg:#fff1dc; --bad:#a52a2a; --badbg:#fbe6e6; --ok:#2f6f3a; --okbg:#e3f2e5;
  --bG:#c9ced6; --bA:#1b7a3a; --bC:#2f6fd0; --bT:#f07e6e; --bN:#222;
  --flank:#4b5563; --tract:#aeb4bd; --anchor:#4b5563; --ins:#b02cb0;
  --hmajor:#CC79A7; --hminor:#E69F00; --snvband:var(--fg);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --fg:#e4e9f0; --muted:#97a3b3; --line:#2c3440; --accent:#4fb3d4;
  --chip:#242c37; --warn:#f0b35a; --warnbg:#3a2c16; --bad:#f08a8a; --badbg:#3c1f22; --ok:#8fd49a; --okbg:#1d3323;
  --bG:#4a525e; --bA:#2a8442; --bC:#6a9cf0; --bT:#ffb0a4; --bN:#ddd;
  --flank:#a7b0bb; --tract:#5f6873; --anchor:#aab4c2; --ins:#e070e0;
  --hmajor:#e07fb0; --hminor:#f0b030; --snvband:var(--fg); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --fg:#e4e9f0; --muted:#97a3b3; --line:#2c3440; --accent:#4fb3d4;
  --chip:#242c37; --warn:#f0b35a; --warnbg:#3a2c16; --bad:#f08a8a; --badbg:#3c1f22; --ok:#8fd49a; --okbg:#1d3323;
  --bG:#4a525e; --bA:#2a8442; --bC:#6a9cf0; --bT:#ffb0a4; --bN:#ddd;
  --flank:#a7b0bb; --tract:#5f6873; --anchor:#aab4c2; --ins:#e070e0;
  --hmajor:#e07fb0; --hminor:#f0b030; --snvband:var(--fg); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:12px}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.01em}
h1 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;border:0;background:var(--panel);color:var(--fg);padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
button:focus-visible,input:focus-visible,tr:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=search]{font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);width:12em}
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.list{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px}
.filters button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:2px 10px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.tablewrap{height:220px;overflow:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);cursor:pointer;z-index:1}
#loci tbody tr{cursor:pointer}
#loci tbody tr:hover{background:var(--chip)}
#loci tbody tr[aria-selected="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.num{text-align:right}
.mono{font-family:var(--mono);font-size:12px}
.pill{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;line-height:18px}
.p-warn{background:var(--warnbg);color:var(--warn)} .p-bad{background:var(--badbg);color:var(--bad)} .p-ok{background:var(--okbg);color:var(--ok)} .p-n{background:var(--chip);color:var(--muted)}
.detail{display:grid;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card h2{font-size:13px;margin:0 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}
.lhead .name{font-size:22px;font-weight:600;font-family:var(--mono)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px;margin-top:8px}
.kv div{min-width:0;overflow-wrap:anywhere} .kv .mono{word-break:break-all} .kv b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.scroll{overflow-x:auto}
.refstrip{font-family:var(--mono);font-size:13px;line-height:1}
.seqcell{display:inline-block;width:12px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
canvas{display:block}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:min(90vw,640px);z-index:20}
.tip .mono{word-break:break-all}
.note{color:var(--muted);font-size:12px;max-width:95ch}
.lab-unk{background:transparent!important;border:1.5px solid var(--muted)}
.help{display:inline-block;width:15px;height:15px;line-height:15px;border-radius:50%;text-align:center;font-size:10px;background:var(--chip);color:var(--muted);cursor:help;text-transform:none;letter-spacing:0;vertical-align:1px}
.sec{margin-top:10px}
.rowband{position:absolute;left:0;pointer-events:none;outline:2px solid var(--fg);background:rgba(127,127,127,.12);border-radius:2px}
.zoomreset{font:inherit;font-size:11px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);cursor:pointer}
.zoomreset:disabled{opacity:.4;cursor:default} .sec h3{font-size:12px;margin:0 0 4px;font-weight:600;display:flex;gap:8px;align-items:center}
.sec h3 i{display:inline-block;width:10px;height:10px;border-radius:2px}
#loading{color:var(--muted)}
</style>
<header>
  <h1>PolyG Locus Reads <small>from panel.db · G strand</small></h1>
  <div class="seg" role="group" aria-label="Sample" id="samples"></div>
  <input type="search" id="q" placeholder="Find locus, e.g. PolyG4320" aria-label="Find locus">
  <label class="note">bases next to each flank <input type="number" id="near" min="0" max="50" step="1" style="width:4em"></label>
</header>
<p id="loading">Loading the locus list…</p>
<div class="main" id="app" hidden>
  <section class="list" aria-label="Loci">
    <div class="filters" id="filters"></div>
    <div class="tablewrap"><table id="loci"><thead><tr>
      <th data-k="locus">Locus</th><th data-k="n_reads" class="num">Reads</th><th data-k="largest_run" class="num">Largest run</th><th data-k="snvs" class="num" id="snvhead">Phasing SNVs</th><th data-k="status">Status</th>
    </tr></thead><tbody></tbody></table></div>
  </section>
  <section class="detail" id="detail"></section>
</div>
<div class="tip" id="tip" hidden></div>
<script>
// The page reads the locus list from /loci and one locus from /locus, served by
// prolyg-phasing view-loci on the local machine.
let LIST,sample=0,current=null,sortKey="locus",sortDir=1,filter="all";
const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=n=>n==null?"–":Number(n).toLocaleString();
const pct=x=>x==null||!isFinite(x)?"–":(100*x).toFixed(1)+"%";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const natural=new Intl.Collator(undefined,{numeric:true});
function baseColor(b){return css({G:"--bG",A:"--bA",C:"--bC",T:"--bT"}[b]||"--bN")}
function coord(orient,start,i){return orient==="-"?start-i:start+i}

async function load(){
  LIST=await (await fetch("loci")).json();
  $("#loading").hidden=true; $("#app").hidden=false;
  $("#near").value=LIST.near;
  $("#near").addEventListener("change",renderDetail);
  LIST.samples.forEach((s,k)=>{const b=document.createElement("button");b.textContent=s.sample;
    b.onclick=()=>{sample=k;route()};$("#samples").appendChild(b)});
  const F=[["all","All"],["noflank","No flank"],["noposition","Side with no position"],["noreads","No reads"]];
  for(const [k,l] of F){const b=document.createElement("button");b.textContent=l;b.dataset.k=k;b.onclick=()=>{filter=k;renderList()};$("#filters").appendChild(b)}
  document.querySelectorAll("#loci th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==="locus"||k==="status"?1:-1}renderList()});
  $("#q").addEventListener("input",renderList);
  $("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const r=visible()[0];if(r)select(r)}});
  window.addEventListener("hashchange",fromHash);
  fromHash();
}
function fromHash(){
  const m=decodeURIComponent(location.hash.slice(1)).match(/^(\d+)\/(.+)$/);
  sample=0;current=null;
  if(m){sample=Math.min(+m[1],LIST.samples.length-1);current=LIST.loci.find(e=>e.locus===m[2])||null}
  renderAll();
}
function route(){location.hash=sample+"/"+encodeURIComponent(current?current.locus:"")}
function select(e){current=e;route()}
function renderAll(){
  document.querySelectorAll("#samples button").forEach((b,k)=>b.setAttribute("aria-pressed",k===sample));
  renderList();renderDetail();
}
function info(e){return e.samples[sample]}
function visible(){
  const q=$("#q").value.trim().toLowerCase();
  let rows=LIST.loci.filter(e=>!q||e.locus.toLowerCase().includes(q));
  if(filter==="noflank")rows=rows.filter(e=>info(e)&&info(e).status!=="recovered");
  if(filter==="noposition")rows=rows.filter(e=>info(e)&&info(e).no_position);
  if(filter==="noreads")rows=rows.filter(e=>info(e)&&info(e).n_reads===0);
  const key=e=>{if(sortKey==="locus")return e.locus;const s=info(e);if(!s)return null;
    if(sortKey==="snvs")return s.snvs?s.snvs.phased+s.snvs.dropped/1000:null;return s[sortKey]};
  return rows.slice().sort((a,b)=>{const x=key(a),y=key(b);
    if(sortKey==="locus")return natural.compare(x,y)*sortDir;
    if(x==null)return 1; if(y==null)return -1;
    return (x>y?1:x<y?-1:0)*sortDir});
}
function snvText(s){if(!s||!s.snvs)return "–";const v=s.snvs;
  if(!v.phased&&!v.dropped)return `<span class="note">no SNV</span>`;
  return fmt(v.phased)+(v.dropped?` <span class="note">(${fmt(v.dropped)})</span>`:"")}
function renderList(){
  $("#snvhead").title=LIST.samples[sample].phasing?"SNVs of this sample's phasing result (snv_calls.tsv): phased, and dropped for low linkage in brackets":"no phasing result given for this sample";
  document.querySelectorAll("#filters button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===filter));
  const tb=$("#loci tbody");tb.textContent="";
  for(const e of visible()){const s=info(e);
    const tr=document.createElement("tr");tr.tabIndex=0;tr.setAttribute("aria-selected",current===e);
    const pill=!s?`<span class="pill p-n">not in panel</span>`:s.status!=="recovered"?`<span class="pill p-bad">${esc(s.status.replaceAll("_"," "))}</span>`:s.no_position?`<span class="pill p-warn">side with no position</span>`:`<span class="pill p-ok">recovered</span>`;
    tr.innerHTML=`<td class="mono">${esc(e.locus)}</td><td class="num">${s?fmt(s.n_reads):"–"}</td><td class="num">${s?fmt(s.largest_run):"–"}</td><td class="num">${snvText(s)}</td><td>${pill}</td>`;
    tr.onclick=()=>select(e);tr.onkeydown=ev=>{if(ev.key==="Enter")select(e)};
    tb.appendChild(tr)}
  // Keep the open locus in view inside the list panel, without moving the page.
  const sel=tb.querySelector('tr[aria-selected="true"]'),wrap=$(".tablewrap");
  if(sel&&(sel.offsetTop<wrap.scrollTop+30||sel.offsetTop>wrap.scrollTop+wrap.clientHeight-20))wrap.scrollTop=sel.offsetTop-60;
}
async function renderDetail(){
  const el=$("#detail");el.textContent="";
  if(!current){el.innerHTML=`<div class="card"><p class="note">Pick a locus in the list. All sequence is on the G strand.</p></div>`;return}
  if(!info(current)){el.innerHTML=`<div class="card"><p class="note">${esc(current.locus)} is not in the panel of ${esc(LIST.samples[sample].sample)}.</p></div>`;return}
  const want=current,ws=sample;
  const q=new URLSearchParams({sample,locus:current.locus,near:$("#near").value});
  const resp=await fetch("locus?"+q);
  if(want!==current||ws!==sample)return;
  if(!resp.ok){el.innerHTML=`<div class="card"><p class="note">${esc(await resp.text())}</p></div>`;return}
  const r=await resp.json();
  if(want!==current||ws!==sample)return;
  el.textContent="";
  el.appendChild(headCard(r));
  if(r.flanks){el.appendChild(refCard(r))}
  const two=document.createElement("div");two.className="two";
  two.appendChild(tractCard(r));two.appendChild(histCard(r));el.appendChild(two);
  if(r.flanks&&r.pileup.sections.some(S=>S.rows.length)){el.appendChild(pileCard(r));el.appendChild(flankingCard(r))}
  el.appendChild(counterCard(r));
}
function flankText(f){
  if(f.status!=="recovered")return `<span class="mono">${esc(f.bases)}</span> <span class="pill p-warn">no reference position</span>`;
  return `<span class="mono">${esc(f.bases)}</span> <span class="note">${fmt(Math.min(f.outer_position,f.run_side_position))}–${fmt(Math.max(f.outer_position,f.run_side_position))}</span>`}
function headCard(r){
  const c=document.createElement("div");c.className="card";const k=r.counters,o=k.n_alignments_overlap_locus;
  const share=n=>`${fmt(n)} (${pct(o?n/o:NaN)})`;
  const drops=[["MAPQ","n_alignments_drop_mapq"],["SA","n_alignments_drop_sa"],["TLEN","n_alignments_drop_tlen"],["no MI","n_alignments_drop_no_mi"],
    ["upstream flank not placed","n_alignments_drop_upstream_flank_not_placed"],["downstream flank not placed","n_alignments_drop_downstream_flank_not_placed"],
    ["no placement","n_alignments_drop_no_placement"],["no base in the BED interval","n_alignments_drop_no_bed_base"],["negative value","n_alignments_drop_negative_value"]];
  c.innerHTML=`<div class="lhead"><span class="name">${esc(r.locus)}</span>
   <span class="mono">${esc(r.chrom)}:${fmt(r.bed_start)}–${fmt(r.bed_end)} (${esc(r.ref_orientation||"?")} strand)</span>
   <span class="pill ${r.reference_window_status==="recovered"?"p-ok":"p-bad"}">${esc(r.reference_window_status.replaceAll("_"," "))}</span>
   <span class="note">${esc(r.sample)} · flanks from ${esc(LIST.samples[sample].flank_table_sample)}</span></div>
   <div class="kv">
    <div><b>Upstream flank</b>${r.flanks?flankText(r.flanks.upstream):"–"}</div>
    <div><b>Downstream flank</b>${r.flanks?flankText(r.flanks.downstream):"–"}</div>
    <div><b>Reference tract</b><span class="mono">${esc(r.reference_tract||"–")}</span> <span class="note">${r.reference_run_lengths.join(",")}</span></div>
    <div><b>Reads in the panel</b>${fmt(k.n_reads)} · ${fmt(k.n_read_pairs)} read pairs (${fmt(k.n_read_pairs_merged)} merged, ${fmt(k.n_read_pairs_drop_disagree)} dropped)</div>
    <div><b>Alignments over the locus</b>${fmt(o)} · ${fmt(k.n_alignments_placed)} placed (${pct(o?k.n_alignments_placed/o:NaN)})</div>
    <div><b>Dropped, share of the alignments over the locus</b>${drops.filter(([,f])=>k[f]).map(([l,f])=>`${l} ${share(k[f])}`).join(" · ")||"none"}</div>
   </div>`;
  const ph=r.phasing;
  if(!ph)c.innerHTML+=`<p class="note">No phasing result given for this sample.</p>`;
  else if(ph.summary){const m=ph.summary;c.innerHTML+=`<div class="kv">
    <div><b>Haplotype profiles</b><span class="mono">major ${esc(m.hap_major_profile||"–")} · minor ${esc(m.hap_minor_profile||"–")}</span></div>
    <div><b>SNVs</b>${fmt(+m.n_snvs_phased)} phased · ${fmt(+m.n_snvs_dropped_low_linkage)} dropped (low linkage)</div>
    <div><b>Reads by phase label</b>major ${fmt(+m.reads_major)} · minor ${fmt(+m.reads_minor)} · unk ${fmt(+m.reads_unk)}</div></div>`}
  if(!r.flanks)c.innerHTML+=`<p class="note">This locus has no flank in this sample, so it has no reads.</p>`;
  return c;
}
function refCard(r){
  const c=document.createElement("div");c.className="card";
  const up=r.flanks.upstream.bases,dn=r.flanks.downstream.bases,t=r.reference_tract,w=up+t+dn,L=w.length;
  const cell=(ch,style="")=>`<span class="seqcell" style="${style}">${ch}</span>`;
  let bases="",band="",idx="";
  for(let i=0;i<L;i++){const z=i<up.length?"var(--flank)":i<up.length+t.length?"var(--tract)":"var(--flank)";
    bases+=cell(w[i],`color:${w[i]==="G"?"var(--fg)":baseColor(w[i])};font-weight:${w[i]==="G"?400:600}`);
    band+=cell("",`background:${z};height:6px;opacity:.75`);
    idx+=cell(i%5===0?`<span style="font-size:9px;color:var(--muted)">${i}</span>`:"")}
  const line=x=>`<div style="white-space:nowrap;height:16px">${x}</div>`;
  c.innerHTML=`<h2>Reference on the G strand${helpMark("The flanks are the matched normal's flank bases. The panel holds no reference bases outside the flanks.")}</h2><div class="scroll"><div class="refstrip">${line(band)+line(bases)+line(idx)}</div></div>
   <div class="legend"><span><i style="background:var(--flank)"></i>flanks</span><span><i style="background:var(--tract)"></i>reference tract</span>
   ${t?"":"<span>No reference tract: a flank has no reference position.</span>"}</div>`;
  return c;
}
function tractSeq(s){return s.split("").map(b=>b==="G"?b:`<span style="color:${baseColor(b)};font-weight:600">${b}</span>`).join("")||"(empty)"}
function tractCard(r){
  const c=document.createElement("div");c.className="card";const total=r.counters.n_reads;const max=Math.max(1,...r.tracts.map(x=>x[1]));
  const L=r.tract_labels,lab=["hap_major","hap_minor","unk"];
  const head=L?lab.map(l=>`<th class="num" style="color:var(${LABEL_COLOR[l]})"><span class="legend" style="display:inline;margin:0">${labelSwatch(l)}</span>${LABEL_NAME[l]}</th>`).join(""):"";
  c.innerHTML=`<h2>Tracts${helpMark("Molecules: distinct read families (MI)."+(L?" Major, minor, unk: reads by phase label.":""))}</h2><div class="note">${fmt(total)} reads, ${fmt(r.n_tracts)} tracts${r.tract_reads_not_shown?` (${fmt(r.n_tracts-r.tracts.length)} tracts, ${fmt(r.tract_reads_not_shown)} reads not listed)`:""}.</div>
   <div class="scroll" style="max-height:420px;overflow:auto"><table><thead><tr><th class="num">Reads</th>${head}<th class="num">Molecules</th><th class="num">Share</th><th></th><th>Tract</th></tr></thead><tbody>${r.tracts.map(([s,n,m],i)=>`<tr><td class="num">${fmt(n)}</td>${L?L[i].map((v,k)=>`<td class="num" style="color:var(${LABEL_COLOR[lab[k]]})">${fmt(v)}</td>`).join(""):""}<td class="num">${fmt(m)}</td><td class="num">${pct(n/total)}</td>
   <td><span style="display:inline-block;height:8px;width:${Math.round(60*n/max)}px;background:var(--muted);border-radius:2px"></span></td>
   <td class="mono">${tractSeq(s)}</td></tr>`).join("")}</tbody></table></div>`;
  return c;
}
function histCard(r){
  const c=document.createElement("div");c.className="card";
  const SH=r.largest_run_shares;
  c.innerHTML=`<h2>Largest G run per read, share of reads${SH?helpMark("One histogram per phase label: each shows the share of that label's reads at each largest G run, on one x axis and one y scale."):""}</h2>`;
  if(!r.largest_run.length){c.innerHTML+=`<p class="note">No reads.</p>`;return c}
  const ks=r.largest_run.map(x=>x[0]);const lo=Math.min(...ks,0),hi=Math.max(...ks,1);
  const W=460,pl=36,bw=(W-pl-8)/(hi-lo+1);
  const axis=(y)=>{let s="";for(let k=lo;k<=hi;k++){const x=pl+(k-lo)*bw;
    if((k-lo)%Math.ceil((hi-lo+1)/14)===0)s+=`<text x="${x+bw/2}" y="${y}" font-size="9" text-anchor="middle" fill="var(--muted)">${k}</text>`}return s};

    const zoomed=lo>0||hi<n;drag={x0:x,x1:x,select:!zoomed||e.shiftKey,lo0:lo,hi0:hi}};
  window.addEventListener("mousemove",e=>{if(!drag)return;const rc=cv.getBoundingClientRect();drag.x1=e.clientX-rc.left;
    if(!drag.select){const d=(drag.x1-drag.x0)/W*(drag.hi0-drag.lo0);lo=drag.lo0-d;hi=drag.hi0-d;clamp()}draw()});
  window.addEventListener("mouseup",()=>{if(!drag)return;
    if(drag.select&&Math.abs(drag.x1-drag.x0)>4){const a=at(Math.min(drag.x0,drag.x1)),b=at(Math.max(drag.x0,drag.x1));lo=a;hi=b;clamp()}
    drag=null;draw()});
  reset.onclick=()=>{lo=0;hi=n;draw()};
  cv.onmousemove=e=>{if(drag||HELP.open)return;const rc=cv.getBoundingClientRect(),i=Math.floor(at(e.clientX-rc.left));
    if(i<0||i>=n){tip.hidden=true;return}
    const cnt=S.counts[i],cov=cnt.reduce((a,b)=>a+b,0);
    tip.hidden=false;tip.style.left=Math.max(8,Math.min(e.clientX+12,innerWidth-320))+"px";tip.style.top=(e.clientY+12)+"px";
    tip.innerHTML=`<b>reference ${fmt(coord(orient,S.start,i))}</b> · ${name}, ${name==="upstream"?n-i:i+1} from the flank${S.snv.includes(i)?" · SNV of the phasing result":""}<div>${fmt(cov)} reads: `+B.split("").map((b,k)=>cnt[k]?`${b} ${fmt(cnt[k])} (${pct(cnt[k]/cov)})`:"").filter(Boolean).join(" · ")+`</div>`};
  cv.onmouseleave=()=>{if(!HELP.open)tip.hidden=true};
  draw();
  // Exposed for a headless check: zoom to a reference range.
  cv.zoomTo=(a,b)=>{lo=a;hi=b;clamp();draw()};
}
function counterCard(r){
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<h2>Extraction counters</h2><div class="scroll"><table><tbody>${Object.entries(r.counters).map(([k,v])=>`<tr><td class="mono">${esc(k)}</td><td class="num">${fmt(v)}</td></tr>`).join("")}</tbody></table></div>`;
  return c;
}
load().catch(e=>{$("#loading").hidden=false;$("#loading").textContent="The locus list could not be read: "+e.message});
